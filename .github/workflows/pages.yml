name: Deploy PROA demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p site/assets
          cp public/assets/PROA-logo.webp site/assets/PROA-logo.webp
          touch site/.nojekyll

      - name: Version static assets
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['GITHUB_SHA'][:12]
          pattern = re.compile(r'(?P<url>assets/[^"\s>]+\.(?:css|js|webp))(?P<query>\?v=[^"\s>]*)?')

          for path in Path('site').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = pattern.sub(lambda match: f"{match.group('url')}?v={version}", text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Redeploy after custom domain configuration.
